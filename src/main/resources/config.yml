# ================================================================
# AgenticNPC 配置文件 v1.1
# ================================================================

# ---- LLM API 配置 ----
llm:
  endpoint: "https://api.deepseek.com/chat/completions"
  api-key: "sk-在这里填写你的API密钥"
  model: "deepseek-v4-flash"
  temperature: 0.8
  max-tokens: 1024
  timeout:
    connect-ms: 3000
    read-ms: 8000

# ---- 限流配置 ----
rate-limit:
  backend: "local"          # local / redis
  global-per-player: false
  max-requests: 5
  period-ms: 60000

# ---- Redis 配置（跨服限流）----
redis:
  host: "localhost"
  port: 6379
  password: ""
  database: 0
  timeout-ms: 2000

# ---- 熔断器配置 ----
circuit-breaker:
  failure-threshold: 5
  recovery-time-ms: 30000

# ---- 记忆配置 ----
memory:
  ttl-minutes: 5
  max-sessions: 500
  max-history-per-session: 10

# ---- 上下文配置 ----
context:
  inventory-enabled: true

# ---- 渲染配置 ----
render:
  action-bar-enabled: true
  sound-enabled: true

# ---- 降级话术 ----
fallback:
  dialogue: "魔法波动过于剧烈，NPC 陷入了沉思..."

# ---- 数据库配置 ----
database:
  backend: "sqlite"
  sqlite:
    file: "memories.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "agentic_npc"
    username: "root"
    password: "your_password"

# ---- 传送守卫（WorldGuard 领地限制）----
teleport-guard:
  enabled: false
  # whitelist: 只能传送到列表中的领地
  # blacklist: 禁止传送到列表中的领地
  mode: "blacklist"
  regions:
    - "spawn"
    - "pvp_arena"

# ---- 压缩配置 ----
compression:
  exit-threshold: 5
  active-threshold: 10
  max-summary-tokens: 1024
  model: ""
  endpoint: ""
  api-key: ""

# ---- 画像配置 ----
profile:
  max-tokens: 512

# ---- 情绪系统 ----
emotion:
  enabled: true

# ---- 服务器标识（BungeeCord 多实例下区分子服）----
server-id: "survival-1"

# ---- Token 告警配置 ----
token-alert:
  single-request-threshold: 800
  daily-player-threshold: 10000

# ---- 审计日志配置 ----
audit:
  enabled: true
  auto-cleanup: true
  retention-days: 30

# ---- XP 配置 ----
xp:
  max-per-action: 1000

# ---- 语义注入防御 ----
semantic-guard:
  enabled: false
  model: "deepseek-v4-flash"
  endpoint: ""
  api-key: ""
  timeout-ms: 2000
  mode: "detect"            # detect / strict

# ---- 调试模式 ----
debug: true

# ================================================================
# NPC Brain 配置
# ================================================================
brains:
  # ---- 艾尔文：神秘旅行者（全能型）----
  - id: "default_npc"
    name: "艾尔文"
    personality: >
      你是一个见多识广的神秘旅行者，走遍了这片大陆的每个角落。
      你性格内敛而睿智，说话简短有深度，不轻易透露自己的过去。
      你对初次见面的冒险者保持礼貌但略显疏离，不会主动给予物品。
      只有当旅行者真正需要帮助且你认为值得时，才会慷慨解囊。
      你的名字是艾尔文，但你很少主动介绍自己，除非对方直接询问。
    fallback-dialogue: "命运的齿轮暂时停止了转动..."
    allowed-action-types:
      - "GIVE_ITEM"
      - "TELEPORT"
      - "GIVE_EFFECT"
      - "SEND_TITLE"
      - "PLAY_SOUND"
      - "GIVE_XP"
    allowed-items:
      - "BREAD"
      - "APPLE"
      - "DIAMOND"
    allowed-potion-effects:
      - "HEAL"
      - "REGENERATION"
      - "SPEED"
      - "NIGHT_VISION"
    dialogue-sound: "ENTITY_VILLAGER_AMBIENT"
    dialogue-sound-volume: 1.0
    dialogue-sound-pitch: 1.0
    action-bar-enabled: true
    profile-scope: "brain"
    emotion-shared: false
    default-emotion: "NEUTRAL"
    sound-whitelist:
      - "ENTITY_VILLAGER_AMBIENT"
      - "ENTITY_VILLAGER_HAPPY"

  # ---- 治疗师梅琳：专职治疗，不给物品不传送 ----
  - id: "healer"
    name: "梅琳"
    personality: >
      你是村庄里的治疗师梅琳，温柔善良，精通草药和治愈魔法。
      你看到受伤的冒险者会心生怜悯，主动提供治疗效果。
      你不会给予物品，也不会传送他人，但你的治愈之力无人能及。
      你说话温柔，喜欢用"亲爱的"称呼对方。
    fallback-dialogue: "治愈之力暂时消散了..."
    allowed-action-types:
      - "GIVE_EFFECT"
      - "SEND_TITLE"
      - "PLAY_SOUND"
    allowed-items: []
    allowed-potion-effects:
      - "HEAL"
      - "REGENERATION"
      - "ABSORPTION"
    dialogue-sound: "ENTITY_VILLAGER_AMBIENT"
    dialogue-sound-volume: 0.8
    dialogue-sound-pitch: 1.2
    action-bar-enabled: true
    profile-scope: "brain"
    emotion-shared: false
    default-emotion: "FRIENDLY"
    sound-whitelist:
      - "ENTITY_VILLAGER_AMBIENT"
      - "UI_TOAST_CHALLENGE_COMPLETE"

  # ---- 传送师奥利安：专职传送，不给物品不加效果 ----
  - id: "teleporter"
    name: "奥利安"
    personality: >
      你是掌握空间魔法的传送师奥利安，性格高傲但实力强大。
      你可以在瞬间将人送到大陆的任何角落，但你需要对方明确说出目的地。
      你从不白干活——除非对方表现出足够的诚意或有趣的灵魂。
      你说话带点神秘感，喜欢用"空间的涟漪"之类的比喻。
    fallback-dialogue: "空间的涟漪暂时紊乱了..."
    allowed-action-types:
      - "TELEPORT"
      - "SEND_TITLE"
      - "PLAY_SOUND"
    allowed-items: []
    allowed-potion-effects: []
    dialogue-sound: "ENTITY_ENDER_DRAGON_FLAP"
    dialogue-sound-volume: 0.5
    dialogue-sound-pitch: 1.5
    action-bar-enabled: true
    profile-scope: "brain"
    emotion-shared: true
    default-emotion: "WARY"
    sound-whitelist:
      - "ENTITY_ENDER_DRAGON_FLAP"
      - "BLOCK_PORTAL_TRAVEL"
